[package]
name = "india-desk"
version = "0.1.0"
edition = "2021"
publish = false
description = "Position book and order gateway for the Indian market desk."

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
nautilus-india-symbology = { path = "../native" }
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { version = "1", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
utoipa = { version = "=5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "=9.0.2", default-features = false, features = ["axum", "vendored"] }
uuid = { version = "1.17", features = ["v4"] }
